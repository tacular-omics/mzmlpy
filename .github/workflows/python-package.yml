name: Python package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - uses: extractions/setup-just@v2
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint and type check
        if: matrix.python-version == '3.13'
        run: just lint ty
      - name: Run tests with coverage and JUnit output
        run: just test-cov
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

  base-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - name: Install without optional codecs
        run: uv sync --locked --no-default-groups --group test --python ${{ matrix.python-version }}
      - name: Verify the base installation
        run: uv run --no-sync python tests/wheel_smoke.py --base-only
      - name: Test available backends
        run: uv run --no-sync pytest tests --ignore=tests/test_docs.py

  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
      - uses: extractions/setup-just@v2
      - run: just install docs-build
      - name: Build and check distributions
        run: |
          uv build
          uvx twine check dist/*
      - name: Test the wheel with only runtime dependencies
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          uv run --no-project --no-sync --python .wheel-venv/bin/python python tests/wheel_smoke.py --base-only --require-wheel

      - name: Test the wheel with the MCP extra
        run: |
          for task_wheel in dist/*.whl
          do
            uv pip install --python .wheel-venv/bin/python "${task_wheel}[mcp]" pytest
          done
          uv run --no-project --python .wheel-venv/bin/python python -c "from mcp.server import MCPServer"
          uv run --no-project --python .wheel-venv/bin/python python -m pytest tests/test_mcp_protocol.py

  mcp-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - name: Install only the MCP extra and test dependencies
        run: uv sync --locked --no-default-groups --group test --extra mcp --python ${{ matrix.python-version }}
      - name: Check optional SDK availability
        run: uv run --no-sync python -c "from mcp.server import MCPServer"
      - name: Test local tools and stdio protocol
        run: uv run --no-sync pytest tests/test_mcp.py tests/test_mcp_extended.py tests/test_mcp_protocol.py
