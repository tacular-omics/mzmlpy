# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install just
      uses: extractions/setup-just@v2
    - name: Install and verify candidate
      run: |
        just install
        just lint
        just ty
        just test
        just docs-build
    - name: Build package with uv
      run: uv build
    - name: Verify tag and distributions
      run: |
        package_version=$(uv run python -c "print(__import__('mzmlpy').__version__)")
        test "v$package_version" = "$GITHUB_REF_NAME"
        uvx twine check dist/*
    - name: Smoke test the wheel without optional dependencies
      run: |
        uv venv .wheel-venv
        uv pip install --python .wheel-venv/bin/python dist/*.whl
        uv run --no-project --no-sync --python .wheel-venv/bin/python python tests/wheel_smoke.py --base-only --require-wheel
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
