site_name: mzmlpy
site_description: A lightweight Python library for parsing mzML mass spectrometry files.
site_url: https://tacular-omics.github.io/mzmlpy/
repo_url: https://github.com/tacular-omics/mzmlpy
repo_name: tacular-omics/mzmlpy
edit_uri: edit/main/docs/
copyright: Copyright &copy; the mzmlpy authors. MIT licence.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
    - MCP server: mcp.md
    - Benchmarks: benchmarks.md
  - API reference:
    - Mzml reader: api/mzml.md
    - Spectrum: api/spectrum.md
    - Chromatogram: api/chromatogram.md
    - Lookup: api/lookup.md
    - Validation and filtering: api/validation.md
    - Indexed gzip: api/indexed-gzip.md
    - Precursor and ions: api/precursor.md
    - File description: api/file-description.md
    - Instrument: api/instrument.md
    - Data processing: api/data-processing.md
    - Metadata: api/metadata.md
    - CV parameters: api/params.md
    - Constants: api/constants.md
  - Changelog: https://github.com/tacular-omics/mzmlpy/blob/main/CHANGELOG.md
  - Citation: citation.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            inherited_members: true
            merge_init_into_class: true
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true
            annotations_path: source
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - md_in_html
  - toc:
      permalink: true
