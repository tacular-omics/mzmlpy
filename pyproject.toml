[project]
name = "mzmlpy"
dynamic = ["version"]
description = "A lightweight Python library for parsing mzML mass spectrometry files."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26.0",
]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/mzmlpy"
Repository = "https://github.com/tacular-omics/mzmlpy"
Documentation = "https://tacular-omics.github.io/mzmlpy/"
Changelog = "https://github.com/tacular-omics/mzmlpy/blob/main/CHANGELOG.md"
Issues = "https://github.com/tacular-omics/mzmlpy/issues"
DOI = "https://doi.org/10.5281/zenodo.21960079"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mzmlpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mzmlpy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mzmlpy",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "tests/data",
    "benchmarks",
    "docs",
    ".github",
    ".claude",
    "site",
]

[tool.uv]
package = true

# pynumpress needs numpy to build its C extension but does not declare it as a
# build dependency, so uv's isolated build otherwise resolves its own (unconstrained)
# numpy for that sandbox instead of reusing the one already resolved for this project.
# On lowest-resolution CI that pulls a numpy with no matching build backend for
# pynumpress; on macOS/Windows it can pull an old numpy whose source build or
# MinGW-built wheel is incompatible with current toolchains. Pin it to the same
# floor as the runtime dependency so the build environment matches.
[tool.uv.extra-build-dependencies]
pynumpress = ["numpy>=1.26.0"]

[dependency-groups]
test = ["pytest>=9", "pytest-cov>=6.0.0", "pytest-examples>=0.0.14"]
dev = [
    "mcp>=2.1.1,<3",
    "pytest>=9",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.14",
    "ruff>=0.16.8",
    "ty>=0.0.83",
    "pyupgrade>=3.15.0",
    "zstd>=1.5.5",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "rapidgzip>=0.14.0",
    "pynumpress>=0.0.8",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1.1,<3"]
numpress = ["pynumpress>=0.0.8"]
zstd = ["zstd>=1.5.5"]
rapidgzip = ["rapidgzip>=0.14.0"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ty.src]
exclude = ["src/mzmlpy/decoder.py", "src/mzmlpy/file_classes/indexedGzip.py", "src/mzmlpy/util.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
