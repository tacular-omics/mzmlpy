[project]
name = "mzmlpy"
dynamic = ["version"]
description = "A lightweight Python library for parsing mzML mass spectrometry files."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26.0",
]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/mzmlpy"
Repository = "https://github.com/tacular-omics/mzmlpy"
Documentation = "https://tacular-omics.github.io/mzmlpy/"
Changelog = "https://github.com/tacular-omics/mzmlpy/blob/main/CHANGELOG.md"
Issues = "https://github.com/tacular-omics/mzmlpy/issues"
DOI = "https://doi.org/10.5281/zenodo.21960079"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mzmlpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mzmlpy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mzmlpy",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "tests/data",
    "benchmarks",
    "docs",
    ".github",
    ".claude",
    "site",
]

[tool.uv]
package = true

[dependency-groups]
test = [
    "hypothesis>=6.100",
    "pytest>=9",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.14",
]
dev = [
    "mcp>=2.1.0,<3",
    "anyio>=4.9",
    "pytest>=9",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.14",
    "ruff>=0.16.8",
    "ty>=0.0.83",
    "pyupgrade>=3.15.0",
    "zstd>=1.5.6.1",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "rapidgzip>=0.12.1",
    "pynumpress>=0.1.2",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
# Every floor below is the lowest version that installs from a wheel on Python 3.12
# (the only Python the `lowest` CI job uses) and passes the full test suite.
# anyio is declared because _mcp_server.py imports it directly; 4.9 is mcp 2.1.0's own
# floor, and mcp raises it to 4.10 itself on Python 3.14.
mcp = ["mcp>=2.1.0,<3", "anyio>=4.9"]
numpress = ["pynumpress>=0.1.2"]
# zstd below 1.5.6.1 has no cp312 wheel, and below 1.5.2.6 it omits the content size from
# the frame header, so empty arrays do not round-trip.
zstd = ["zstd>=1.5.6.1"]
# rapidgzip 0.11.1 and below segfault on a read from a worker thread. 0.11.2 and 0.12.0
# are yanked, so 0.12.1 is the lowest release above the last crashing one.
rapidgzip = ["rapidgzip>=0.12.1"]

[tool.pytest.ini_options]
markers = [
    "slow: slower than ~1 s (subprocess launches, memory-flatness checks); skipped unless --run-slow or RUN_SLOW=1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ty.src]
exclude = ["src/mzmlpy/decoder.py", "src/mzmlpy/file_classes/indexedGzip.py", "src/mzmlpy/util.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
